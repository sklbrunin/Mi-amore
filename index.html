<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Isabela ❤️</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}

canvas{
    display:block;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const messages = [
"Eu te amo",
"I love you",
"Te amo",
"Je t'aime",
"Ti amo",
"Ich liebe dich",
"Isabela ❤️"
];

const points = [];

for(let t=0;t<Math.PI*2;t+=0.08){

    const x = 16*Math.pow(Math.sin(t),3);
    const y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));

    points.push({
        x,
        y,
        text: messages[Math.floor(Math.random()*messages.length)]
    });
}

function draw(){

    ctx.fillStyle="rgba(0,0,0,0.15)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const scale = 25 + Math.sin(Date.now()/500)*2;

    ctx.font="18px Arial";
    ctx.textAlign="center";

    points.forEach(p=>{

        const px = canvas.width/2 + p.x*scale;
        const py = canvas.height/2 + p.y*scale;

        const glow = 100 + Math.sin(Date.now()/300)*50;

        ctx.shadowBlur = glow;
        ctx.shadowColor = "#ff0066";
        ctx.fillStyle = "#ff4da6";

        ctx.fillText(p.text, px, py);
    });

    ctx.shadowBlur = 30;
    ctx.fillStyle = "white";
    ctx.font = "bold 60px Arial";

    ctx.fillText("Isabela", canvas.width/2, canvas.height/2);

    ctx.font = "35px Arial";
    ctx.fillStyle = "#ff6699";

    ctx.fillText("❤️", canvas.width/2, canvas.height/2 + 50);

    requestAnimationFrame(draw);
}
canvas.addEventListener("click", () => {
    alert("Isabela, você é a melhor parte dos meus dias ❤️");
});
draw();

</script>
</body>
</html>
